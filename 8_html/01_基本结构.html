<!DOCTYPE html>
<!--
  第 01 课：HTML 的基本结构

  学习目标：
  1. 认识一个 HTML 文档的骨架。
  2. 分清标签、元素、属性和文字内容。
  3. 分清浏览器标签页的标题与页面中的标题。

  学习方法：用编辑器查看源码，用浏览器打开同一个文件。
  修改后先保存文件，再刷新浏览器，观察变化。

  HTML 用于描述内容及其结构；CSS 控制外观；JavaScript 编写交互逻辑。
  本套文件先学习 HTML，不需要安装依赖。

  第一行的 DOCTYPE 是文档类型声明，让浏览器使用标准模式解析页面。
  它不是普通的 HTML 标签，也不需要结束标签。
-->
<html lang="zh-CN">
  <!-- html 是根元素。lang 声明主要语言，有助于朗读工具和翻译工具。 -->
  <head>
    <!-- head 保存文档信息，通常不直接作为正文显示。 -->
    <!-- 文件本身也应以 UTF-8 编码保存，避免中文乱码。 -->
    <meta charset="UTF-8">
    <!-- viewport 让移动设备按设备宽度布局。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- title 显示在浏览器标签页上，也常作为收藏时的名称。 -->
    <title>第 01 课：HTML 基本结构</title>
  </head>
  <body>
    <!-- body 中放置用户可以看到的页面内容。 -->
    <h1>我的第一个 HTML 页面</h1>
    <p>你好，我正在学习 HTML。</p>
    <p>保存源码并刷新浏览器，就能看到修改后的效果。</p>

    <!--
      用 <p>你好</p> 理解基本术语：
      <p> 是开始标签，</p> 是结束标签，“你好”是内容。
      整体叫作一个 p 元素。

      用 <html lang="zh-CN"> 理解属性：
      lang 是属性名，zh-CN 是属性值，属性写在开始标签内。
      本套示例统一给属性值加双引号。

      meta 是空元素，不包含子内容，也没有结束标签。
      后面会遇到的 img、br、input 也是空元素。

      缩进方便人阅读，不决定元素的父子关系；标签的嵌套才决定结构。
      元素应正确嵌套，例如 <p><strong>重点</strong></p>。

      HTML 注释不会作为正文显示，但查看源码仍然可以看到。
      注释不能嵌套，也不适合存放密码等私密信息。
    -->

    <!--
      动手练习：
      1. 修改 title，再修改 h1，对比浏览器中两个位置的变化。
      2. 新增一个 p 元素，写下你的学习目标。
      3. 在新增段落上方写一条自己的 HTML 注释。
    -->
  </body>
</html>
