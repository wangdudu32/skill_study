<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第 03 课：链接与路径</title>
  </head>
  <body>
    <!--
      第 03 课：链接与路径
      目标：区分完整 URL、相对路径和页面内锚点。
      a 创建超链接，href 指定目标，元素中的文字是用户看到的链接内容。
      使用清楚的链接文字，例如“查看第一课”，比只有“点击这里”更易理解。
    -->
    <h1 id="top">链接与路径</h1>

    <h2>一、跳转到同目录文件</h2>
    <!-- 相对路径通常以当前 HTML 文件所在目录为基准。文件名必须准确。 -->
    <p><a href="01_基本结构.html">查看第一课：基本结构</a></p>
    <p><a href="./02_文本标签.html">查看第二课：文本标签</a></p>
    <!--
      01_基本结构.html 与 ./01_基本结构.html 都指向同目录文件。
      如果将来有子目录，可以写 lessons/lesson.html。
      ../lesson.html 表示先回到上一级目录，再找 lesson.html。
      URL 中使用正斜杠 /；不要把自己电脑上的绝对文件路径发给别人使用。
      以 / 开头的路径在 HTTP 网站中从站点根路径开始，不是当前目录。
      Linux 等环境通常区分文件名大小写。
    -->

    <h2>二、打开外部网站</h2>
    <!-- 完整 URL 包含协议和域名。这个示例需要联网才能访问目标网站。 -->
    <p><a href="https://example.com/">访问 Example 示例网站</a></p>
    <!--
      target="_blank" 请求在新的浏览上下文打开，通常是新标签页。
      rel="noopener" 明确阻止新页面通过 opener 访问原窗口。
      链接文字提醒打开方式，让用户提前知道点击后的行为。
    -->
    <p><a href="https://example.com/" target="_blank" rel="noopener">访问 Example 示例网站（新标签页）</a></p>

    <h2>三、页面内锚点</h2>
    <!-- # 后面的值必须与目标元素的 id 一致；同一页面内 id 不能重复。 -->
    <p><a href="#practice">跳到本课练习</a></p>
    <p><a href="#top">回到本页标题</a></p>
    <p>点击锚点后观察地址栏末尾的变化。若目标已经在视野内，滚动可能不明显。</p>
    <!-- “文件名#id”可跳到另一个文件里的指定位置。第十课提供了 projects。 -->
    <p><a href="10_综合练习.html#projects">查看第十课的项目经历</a></p>

    <h2>四、下载同目录文件</h2>
    <!-- download 表示希望下载目标资源；同源或本地场景也可能受浏览器策略影响。 -->
    <p><a href="01_基本结构.html" download="第一课源码.html">尝试下载第一课源码</a></p>

    <h2 id="practice">本课练习</h2>
    <p>在源码中完成下方练习，然后逐一点击链接检查。</p>
    <!--
      动手练习：
      1. 新增一个链接，跳转到 04_图片.html。
      2. 新增一个标题并为它设置 id，再增加一个能跳到该标题的链接。
      3. 把第一条文件链接临时改成不存在的文件名，观察失败后再恢复。

      常见错误：只写 www.example.com 会被当成相对路径，而非完整网址。
      空 href 仍然是链接；如果需要执行操作，应考虑 button，而不是伪造链接。
    -->
  </body>
</html>
